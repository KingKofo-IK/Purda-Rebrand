<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purda House of Fashion — Consultation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Work+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#E7E5DF;
    --ivory-soft:#F0EEE8;
    --ink:#201E1B;
    --ink-soft:#201E1Bb3;
    --wine:#3A3A3A;
    --wine-deep:#232323;
    --gold:#5A5A5A;
    --gold-soft:#8A8A8A;
    --clay:#9C4A2E;
    --blush:#E2E0DA;
    --line: rgba(36,23,19,0.14);
    --radius: 2px;
    --shadow: 0 30px 60px -20px rgba(36,23,19,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Work Sans',sans-serif;
    color:var(--ink);
    background:var(--ivory);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Fraunces',serif;
    font-weight:500;
    margin:0;
  }
  .eyebrow{
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold-soft);
  }
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:'Work Sans',sans-serif;}

  /* ---------- App shell ---------- */
  #app{ position:relative; width:100%; min-height:100vh; overflow:hidden; }

  .wordmark{
    position:absolute; top:20px; left:50%; transform:translateX(-50%);
    text-align:center; z-index:30;
  }
  .wordmark img{ height:50px; width:auto; display:block; }

  /* vertical side category rail, flush to the right edge */
  .cat-tabs{
    position:fixed; top:0; right:0; bottom:0; z-index:40;
    width:184px; display:flex; flex-direction:column; justify-content:center; align-items:stretch;
    background:linear-gradient(270deg, rgba(20,10,8,0.55), rgba(20,10,8,0) 75%);
  }
  .cat-tabs.on-light{ background:var(--ivory-soft); border-left:1px solid var(--line); }
  .cat-tab{
    background:none; border:none; border-bottom:1px solid rgba(255,255,255,0.18);
    color:rgba(255,255,255,0.68); font-family:'Work Sans',sans-serif; font-size:13px; letter-spacing:0.05em;
    text-align:right; padding:20px 30px; position:relative; transition:color .2s ease, background .2s ease, box-shadow .2s ease;
  }
  .cat-tabs .cat-tab:last-child{ border-bottom:none; }
  .cat-tabs.on-light .cat-tab{ color:var(--ink-soft); border-bottom:1px solid var(--line); }
  .cat-tab.active{ color:#fff; box-shadow:inset 3px 0 0 var(--gold); background:rgba(255,255,255,0.06); }
  .cat-tabs.on-light .cat-tab.active{ color:var(--wine); background:var(--blush); box-shadow:inset 3px 0 0 var(--wine); }

  @media (max-width:820px){
    .cat-tabs{
      top:auto; left:0; right:0; bottom:0; width:auto; height:auto;
      flex-direction:row; justify-content:center; align-items:center; gap:0;
      background:linear-gradient(0deg, rgba(0,0,0,0.55), rgba(0,0,0,0));
    }
    .cat-tabs.on-light{ background:var(--ivory); border-left:none; border-top:1px solid var(--line); }
    .cat-tab{ border-bottom:none; text-align:center; padding:16px 18px; }
    .cat-tabs.on-light .cat-tab{ border-bottom:none; }
    .cat-tab.active{ box-shadow:inset 0 3px 0 var(--gold); background:none; }
    .cat-tabs.on-light .cat-tab.active{ box-shadow:inset 0 3px 0 var(--wine); background:none; }
  }

  /* ---------- Views ---------- */
  .view{ display:none; min-height:100vh; }
  .view.active{ display:block; }

  /* ===== Hero (Prom / Custom Dresses) ===== */
  .hero{
    position:relative; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background-size:cover; background-position:center;
    text-align:center; padding:120px 24px 110px;
  }
  .hero::before{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(35,35,35,0.55) 0%, rgba(35,35,35,0.35) 40%, rgba(35,35,35,0.75) 100%);
  }
  .hero-inner{ position:relative; z-index:2; max-width:640px; }
  .hero .eyebrow{ color:var(--gold-soft); margin-bottom:18px; display:block; }
  .hero h1{
    font-size:clamp(34px,6vw,56px); color:#fff; line-height:1.08; letter-spacing:-0.01em;
  }
  .hero p.sub{
    font-family:'Fraunces',serif; font-style:italic; font-weight:400;
    color:var(--blush); font-size:17px; margin-top:20px; line-height:1.5;
  }
  .hero p.note{
    color:rgba(255,255,255,0.8); font-size:13px; margin-top:10px; letter-spacing:0.02em;
  }
  .btn-primary{
    margin-top:34px; display:inline-flex; align-items:center; gap:10px;
    background:var(--gold); color:var(--wine-deep); border:1px solid var(--gold);
    padding:16px 34px; border-radius:999px; font-size:14px; letter-spacing:0.04em; font-weight:600;
    transition:background .25s ease, transform .2s ease, color .25s ease;
  }
  .btn-primary:hover{ background:transparent; color:var(--gold-soft); transform:translateY(-1px); }
  .hero .takes{
    display:block; margin-top:14px; font-family:'Space Mono',monospace; font-size:11px;
    letter-spacing:0.08em; color:rgba(255,255,255,0.6);
  }

  /* ===== Wizard (multi-step) ===== */
  .wizard{
    position:relative; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background-size:cover; background-position:center; padding:130px 20px 120px;
  }
  .wizard::before{
    content:""; position:absolute; inset:0; background:rgba(35,35,35,0.5);
  }
  .card{
    position:relative; z-index:2; width:100%; max-width:560px;
    background:var(--ivory-soft); border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:44px 40px 34px;
  }
  @media (max-width:600px){ .card{ padding:32px 22px 26px; } }

  /* stitched progress */
  .stitch-wrap{ margin-bottom:26px; }
  .stitch-meta{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .stitch-track{
    position:relative; height:14px;
  }
  .stitch-track svg{ width:100%; height:100%; display:block; overflow:visible; }
  .stitch-bg-line{ stroke:var(--line); stroke-width:1.5; stroke-dasharray:1 7; stroke-linecap:round; }
  .stitch-fill-line{ stroke:var(--gold); stroke-width:1.5; stroke-dasharray:1 7; stroke-linecap:round; transition:stroke-dashoffset .5s ease; }
  .stitch-needle{ transition:cx .5s ease; }

  .step-title{ font-size:clamp(22px,3.4vw,28px); line-height:1.25; margin-bottom:6px; }
  .step-hint{ color:var(--ink-soft); font-size:13.5px; margin-bottom:22px; line-height:1.5; }

  .field-row{ display:flex; gap:14px; }
  .field-row .field{ flex:1; }
  .field{ margin-bottom:16px; }
  .field label{
    display:block; font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--ink-soft); margin-bottom:7px; font-family:'Space Mono',monospace;
  }
  .field input[type=text],
  .field input[type=email],
  .field input[type=tel],
  .field input[type=date],
  .field select,
  .field textarea{
    width:100%; border:1px solid var(--line); background:#fff; color:var(--ink);
    padding:13px 14px; font-size:15px; border-radius:2px; outline:none;
    transition:border-color .2s ease;
  }
  .field textarea{ resize:vertical; min-height:100px; font-family:'Work Sans',sans-serif; }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--wine); }
  .helper{ font-size:12px; color:var(--ink-soft); margin-top:7px; line-height:1.5; }
  .consent-row{ display:flex; gap:10px; align-items:flex-start; margin-top:10px; }
  .consent-row input[type=checkbox]{ margin-top:3px; width:16px; height:16px; flex-shrink:0; accent-color:var(--wine); }
  .consent-row label{ font-size:12px; color:var(--ink-soft); line-height:1.5; text-transform:none; letter-spacing:normal; font-family:'Work Sans',sans-serif; margin:0; cursor:pointer; }

  .choice-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:4px; }
  .choice-grid.stack{ grid-template-columns:1fr; }
  .choice{
    border:1px solid var(--line); background:#fff; padding:16px 16px; border-radius:2px;
    text-align:left; font-size:14px; color:var(--ink); transition:border-color .2s ease, background .2s ease;
  }
  .choice strong{ display:block; font-family:'Fraunces',serif; font-weight:500; font-size:16px; margin-bottom:3px; }
  .choice span{ color:var(--ink-soft); font-size:12.5px; }
  .choice.selected{ border-color:var(--wine); background:var(--blush); }

  .upload-zone{
    border:1.5px dashed var(--line); border-radius:2px; padding:26px 16px; text-align:center;
    background:#fff; cursor:pointer; transition:border-color .2s ease, background .2s ease;
  }
  .upload-zone.dragover{ border-color:var(--wine); background:var(--blush); }
  .upload-zone svg{ margin-bottom:8px; }
  .upload-zone .u-title{ font-size:13.5px; font-weight:500; }
  .upload-zone .u-sub{ font-size:12px; color:var(--ink-soft); margin-top:3px; }
  .thumbs{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .thumb{ position:relative; width:74px; height:74px; border-radius:2px; overflow:hidden; border:1px solid var(--line); }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb button{
    position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%;
    background:rgba(36,23,19,0.75); color:#fff; border:none; font-size:11px; line-height:1;
  }

  .nav-row{ display:flex; justify-content:space-between; align-items:center; margin-top:28px; }
  .btn-back{
    background:none; border:none; color:var(--ink-soft); font-size:13px; letter-spacing:0.02em;
    display:flex; align-items:center; gap:6px;
  }
  .btn-next{
    background:var(--wine); color:var(--ivory-soft); border:1px solid var(--wine);
    padding:14px 30px; border-radius:999px; font-size:14px; font-weight:600; letter-spacing:0.03em;
    transition:background .2s ease, color .2s ease;
  }
  .btn-next:hover{ background:var(--wine-deep); }
  .btn-next:disabled{ opacity:0.4; cursor:not-allowed; }

  .review-list{ margin:0 0 22px; padding:0; list-style:none; border-top:1px solid var(--line); }
  .review-list li{
    display:flex; justify-content:space-between; gap:16px; padding:12px 0; border-bottom:1px solid var(--line);
    font-size:13.5px;
  }
  .review-list li .k{ color:var(--ink-soft); flex-shrink:0; width:42%; font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.04em; text-transform:uppercase; padding-top:2px;}
  .review-list li .v{ text-align:right; flex:1; }

  /* ===== Thank you ===== */
  .thankyou{
    min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center;
    background:var(--ivory); padding:120px 24px;
  }
  .thankyou h2{ font-size:clamp(28px,4vw,40px); color:var(--wine-deep); }
  .thankyou p{ max-width:460px; margin:16px auto 0; color:var(--ink-soft); line-height:1.6; font-size:15px; }
  .thankyou .btn-primary{ background:var(--wine); color:var(--ivory-soft); border-color:var(--wine); margin-top:28px;}
  .thankyou .btn-primary:hover{ background:var(--wine-deep); color:#fff; }

  /* ===== Bridal single-page form ===== */
  .bridal-hero{
    position:relative; min-height:60vh; display:flex; align-items:center; justify-content:center;
    background-size:cover; background-position:center; text-align:center; padding:130px 24px 60px;
  }
  .bridal-hero::before{ content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(35,35,35,0.55), rgba(231,229,223,1)); }
  .bridal-hero-inner{ position:relative; z-index:2; max-width:600px; }
  .bridal-hero h1{ font-size:clamp(32px,5vw,48px); color:#fff; }
  .bridal-hero p{ color:var(--blush); font-family:'Fraunces',serif; font-style:italic; margin-top:14px; font-size:16px; }

  .bridal-form-wrap{ background:var(--ivory); padding:0 20px 140px; display:flex; justify-content:center; }
  .bridal-form{
    width:100%; max-width:620px; background:var(--ivory-soft); border:1px solid var(--line);
    border-radius:2px; padding:40px; margin-top:-70px; position:relative; z-index:3; box-shadow:var(--shadow);
  }
  @media (max-width:600px){ .bridal-form{ padding:26px 20px; } }
  .bridal-form .section-label{
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--gold); margin:26px 0 12px; padding-top:14px; border-top:1px solid var(--line);
  }
  .bridal-form .section-label:first-child{ border-top:none; padding-top:0; margin-top:0; }
  .submit-bar{ margin-top:30px; }
  .submit-bar button{ width:100%; }

  .status-msg{
    margin-top:16px; font-size:13px; padding:12px 14px; border-radius:2px; display:none;
  }
  .status-msg.show{ display:block; }
  .status-msg.error{ background:#F6DCD4; color:#7a2b12; }

  @media (min-width:821px){
    .hero, .wizard, .bridal-hero, .thankyou{ padding-right:184px; }
    .bridal-form-wrap{ padding-right:184px; }
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }

  .visually-hidden{
    position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap;
  }
  :focus-visible{ outline:2px solid var(--wine); outline-offset:2px; }
</style>
</head>
<body>

<noscript>

<div id="app"></div>

<script>
/* =========================================================================
   PURDA HOUSE OF FASHION — Consultation Intake System
   Bridal (single page) + Prom / Custom Dresses (multi-step wizard)

   SUBMISSION SETUP (read before going live):
   This connects to the Purda automation backend (see /purda-backend) which
   sends confirmation emails + texts and alerts the studio. Deploy that
   Worker first (see its README), then paste its URL into WORKER_ENDPOINT
   below. Until it's set, submissions are logged to the browser console and
   the thank-you screen still shows, so you can test the flow end to end.
   ========================================================================= */
  const WORKER_ENDPOINT = "https://purda-automation.purdahouse.workers.dev/api/inquiry";
  const NOTIFY_EMAIL = "purdadesigns@gmail.com";

  const CATEGORIES = {
    bridal: {
      key: "bridal",
      label: "Bridal",
      layout: "single",
      hero: "images/prom-solo-silver.jpeg",
      wizardBg: "images/prom-solo-silver.jpeg",
      eyebrow: "Custom Bridal",
      title: "Custom Bridal",
      sub: "Thank you for considering us for your special day.",
      note: "We take on a limited number of brides each season to ensure a deeply personal, thoughtful process. Tell us about your day below.",
      startingPrice: "Bridal Couture Collection — Corseted Luxury Bespoke $3,750 · Corseted High-End Custom $3,125 · Corseted Core Collection $2,625 · Standard Collection (Corseted) $2,375. These are starting prices — your final price may change after your consultation.",
      // Bucket breakpoints sit exactly at Bridal Couture's own tier floors:
      // Standard $2,375 · Core $2,625 · High-End $3,125 · Luxury $3,750
      budgetOptions: ["Under $2,375","$2,375 – $2,624","$2,625 – $3,124","$3,125 – $3,749","$3,750+"]
    },
    prom: {
      key: "prom",
      label: "Prom",
      layout: "steps",
      hero: "images/prom-solo-silver-pearls-night.jpeg",
      wizardBg: "images/prom-solo-silver-pearls-night.jpeg",
      eyebrow: "Prom 2027",
      title: "Your Dream Prom Look Begins Here",
      sub: "Every gown we create is a story of confidence, beauty, and unforgettable moments.",
      note: "Limited 2027 prom spots available — reserve early.",
      cta: "Secure Your Spot",
      startingPrice: "Prom & Gala Collection (Signature) — Corset Luxury Dubai Bespoke $3,000 · High-End Custom $2,500 · Core Collection $2,100 · Standard Collection $1,900. These are starting prices — your final price may change after your consultation.",
      // Bucket breakpoints sit exactly at Prom & Gala's own tier floors:
      // Standard $1,900 · Core $2,100 · High-End $2,500 · Luxury $3,000
      budgetOptions: ["Under $1,900","$1,900 – $2,099","$2,100 – $2,499","$2,500 – $2,999","$3,000+"]
    },
    custom: {
      key: "custom",
      label: "Custom Dresses",
      layout: "steps",
      hero: "images/prom-couple-gold.jpeg",
      wizardBg: "images/prom-couple-gold.jpeg",
      eyebrow: "AsoEbi & Custom Occasion Wear",
      title: "Create Anything You Can Imagine",
      sub: "AsoEbi, birthdays, and one-of-a-kind occasion pieces, cut and stitched around you.",
      note: "Please fill out this form and we'll contact you to continue the process.",
      disclaimer: "If your event is Prom, this quote does not apply to you — please book through the regular Prom inquiry form instead. Prom garments are priced at the Prom rate, not the Custom rate.",
      cta: "Start Custom Dress Consultation",
      startingPrice: "Bridal reception outfit or Birthday outfit collection — Luxury Bespoke corseted $2,100–$2,175 · High-End Custom (Corseted) $1,750–$1,813 · Core Collection $1,470–$1,523 · Standard Collection $1,330–$1,378. These are starting prices — your final price may change after your consultation.",
      // Bucket breakpoints sit exactly at Reception & Birthday's own tier
      // floors (using the low end of each tier's range):
      // Standard $1,330 · Core $1,470 · High-End $1,750 · Luxury $2,100
      budgetOptions: ["Under $1,330","$1,330 – $1,469","$1,470 – $1,749","$1,750 – $2,099","$2,100+"]
    }
  };

  const FIND_US_OPTIONS = ["Instagram","Facebook","Google Search","Referral from a friend","Past client","Other"];


  // ---- wizard step schema (shared by prom + custom) ----
  function getSteps(cat){
    return [
      { id:"name", title:"Let's start with your name.", type:"name" },
      { id:"email", title:"What's the best email to reach you?", type:"email" },
      { id:"phone", title:"And a phone number?", type:"phone" },
      { id:"eventDate", title:"What's your deadline date?", type:"date", key:"eventDate" },
      { id:"location", title:"Where's your event?", hint:"City, State or venue name.", type:"location", key:"location" },
      { id:"consultation", title:"How would you like your first consultation?", type:"consultation" },
      { id:"description", title:"Describe the dress you're dreaming of.", hint:"Silhouette, fabric, color, neckline, inspiration — whatever comes to mind.", type:"textarea", key:"description" },
      { id:"photos", title:"Share up to 3 inspiration photos.", hint:"Screenshots, magazine photos, or moodboards all work.", type:"photos" },
      { id:"size", title:"What's your current size?", hint:"Your everyday size is fine — we'll confirm exact measurements at your consultation.", type:"size" },
      { id:"budget", title:"What's your budget range for this piece?", type:"budget" },
      { id:"delivery", title:"Would you like to pick up your piece, or have it shipped?", type:"delivery" },
      { id:"source", title:"How did you find Purda?", type:"source" },
      { id:"review", title:"Review your inquiry", type:"review" }
    ];
  }

  const state = {
    activeCategory: "prom",
    wizard: { stepIndex:0, data:{ firstName:"",lastName:"",email:"",phone:"",smsConsent:false,eventDate:"",location:"",consultation:"",description:"",size:"",budget:"",delivery:"",source:"" }, photos:[] },
    submitting:false
  };

  const app = document.getElementById("app");

  function render(){
    const cat = CATEGORIES[state.activeCategory];
    if(cat.layout === "single"){
      renderBridal(cat);
    } else {
      renderWizardShell(cat);
    }
  }

  function wordmark(onLight){
    return `<div class="wordmark${onLight? ' on-light':''}">
      <img src="images/purda-logo.png" alt="Purda House of Fashion">
    </div>`;
  }

  function catTabs(onLight){
    const keys = ["prom","custom","bridal"];
    return `<div class="cat-tabs${onLight?' on-light':''}">
      ${keys.map(k=>`
        <button class="cat-tab${state.activeCategory===k?' active':''}" data-cat="${k}">${CATEGORIES[k].label}</button>
      `).join('')}
    </div>`;
  }

  /* ---------------- BRIDAL (single page) ---------------- */
  function renderBridal(cat){
    app.innerHTML = `
      ${wordmark(false)}
      <div class="view active">

  function wireChoiceGroup(body, field, d){
    body.querySelectorAll(".choice").forEach(btn=>{
      if(btn.dataset.val === d[field]) btn.classList.add("selected");

        d[field] = btn.dataset.val;
        body.querySelectorAll(".choice").forEach(b=>b.classList.remove("selected"));
        btn.classList.add("selected");
      });
    });
  }

  function validateStep(step){
    const d = state.wizard.data;
    const statusEl = document.getElementById("wizardStatus");
    let ok = true; let msg = "";
    switch(step.type){
      case "name": ok = d.firstName.trim() && d.lastName.trim(); msg="Please enter your first and last name."; break;
      case "email": ok = /.+@.+\..+/.test(d.email); msg="Please enter a valid email."; break;
      case "phone": ok = d.phone.trim().length >= 7 && d.smsConsent; msg = d.smsConsent ? "Please enter a valid phone number." : "Please check the box to consent to text messages."; break;
      case "date": ok = !!d.eventDate; msg="Please choose your deadline date."; break;
      case "location": ok = d.location.trim().length > 0; msg="Please enter your event location."; break;
      case "consultation": ok = !!d.consultation; msg="Please choose a consultation type."; break;
      case "photos": ok = state.wizard.photos.length > 0; msg="Please add at least one inspiration photo."; break;
      case "size": ok = d.size.trim().length > 0; msg="Please enter your size."; break;
      case "budget": ok = !!d.budget; msg="Please select a budget range."; break;
      case "delivery": ok = !!d.delivery; msg="Please choose pickup or shipping."; break;
      case "source": ok = !!d.source; msg="Please tell us how you found us."; break;
      default: ok = true;
    }
    if(!ok && statusEl){ statusEl.textContent = msg; statusEl.className = "status-msg error show"; }
    return ok;
  }

  /* ---------------- Photo uploader (shared) ---------------- */
  function mountUploader(container, photosArr, onChange){
    container.innerHTML = `
      <div class="upload-zone" id="uz" tabindex="0" role="button" aria-label="Upload inspiration photos">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#241713" stroke-width="1.4"><path d="M12 3v12M7 8l5-5 5 5M4 21h16"/></svg>
        <div class="u-title">Drop inspiration photos here</div>
        <div class="u-sub">Screenshots, magazine photos, or moodboards — up to 3</div>
      </div>
      <input type="file" id="fileInput" accept="image/*" multiple class="visually-hidden">
      <div class="thumbs" id="thumbs"></div>
    `;
    const uz = container.querySelector("#uz");
    const fileInput = container.querySelector("#fileInput");
    const thumbs = container.querySelector("#thumbs");

    function paint(){
      thumbs.innerHTML = photosArr.map((p,i)=>`
        <div class="thumb"><img src="${p.url}" alt="Inspiration ${i+1}"><button type="button" data-i="${i}" aria-label="Remove photo">×</button></div>
      `).join('');
      thumbs.querySelectorAll("button").forEach(b=>{
        b.addEventListener("click",()=>{
          photosArr.splice(Number(b.dataset.i),1);
          paint();
          onChange();
        });
      });
    }
    paint();

    function addFiles(fileList){
      const files = Array.from(fileList).filter(f=>f.type.startsWith("image/"));
      for(const f of files){
        if(photosArr.length >= 3) break;
        photosArr.push({ file:f, url:URL.createObjectURL(f) });
      }
      paint();
      onChange();
    }

    uz.addEventListener("click", ()=>fileInput.click());
    uz.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); fileInput.click(); } });
    fileInput.addEventListener("change", e=>addFiles(e.target.files));
    uz.addEventListener("dragover", e=>{ e.preventDefault(); uz.classList.add("dragover"); });
    uz.addEventListener("dragleave", ()=>uz.classList.remove("dragover"));
    uz.addEventListener("drop", e=>{ e.preventDefault(); uz.classList.remove("dragover"); addFiles(e.dataTransfer.files); });
  }

  function fileToBase64(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]); // strip data: prefix
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  /* ---------------- Submission ---------------- */
  async function submitWizard(cat){
    const btn = document.getElementById("nextBtn");
    const statusEl = document.getElementById("wizardStatus");
    const d = state.wizard.data;
    const payload = {
      category: cat.label,
      firstName:d.firstName, lastName:d.lastName, email:d.email, phone:d.phone,
      eventDate:d.eventDate, location:d.location, consultation:d.consultation, description:d.description,
      delivery:d.delivery,
      size:d.size, budget:d.budget, source:d.source
    };
    await submitInquiry(payload, btn, statusEl, cat.key);
  }

  async function submitInquiry(payload, btnEl, statusEl, catKey){
    if(state.submitting) return;
    state.submitting = true;
    const originalLabel = btnEl.textContent;
    btnEl.disabled = true;
    btnEl.textContent = "Submitting…";
    statusEl.className = "status-msg";

    let linkEligible = true;
    let holdMessage = null;
    try{
      if(WORKER_ENDPOINT){
        const photos = await Promise.all(state.wizard.photos.map(async p => ({
          name: p.file.name,
          base64: await fileToBase64(p.file)
        })));
        const res = await fetch(WORKER_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ...payload, photos })
        });
        const resJson = await res.json();
        if(!resJson.success) throw new Error(resJson.message || "Submission failed");
        if(typeof resJson.linkEligible === "boolean") linkEligible = resJson.linkEligible;
        if(typeof resJson.holdMessage === "string") holdMessage = resJson.holdMessage;
      } else {
        // Demo mode — no backend URL configured yet.
        console.log("PURDA INQUIRY (demo mode — deploy /purda-backend and set WORKER_ENDPOINT):", payload, state.wizard.photos.map(p=>p.file?.name));
        await new Promise(r=>setTimeout(r, 500));
      }
      showThankYou(CATEGORIES[catKey], payload, linkEligible, holdMessage);
    } catch(err){
      statusEl.textContent = "Something went wrong sending your inquiry. Please try again, or email us directly at purdadesigns@gmail.com.";
      statusEl.className = "status-msg error show";
      btnEl.disabled = false;
      btnEl.textContent = originalLabel;
    } finally {
      state.submitting = false;
    }
  }

            <li><strong>Preparation:</strong> Please have your event date, budget range, and inspiration photos ready for our 25-minute call.</li>
            <li><strong>Payment:</strong> We do not accept Apple Card or Cash App Card as payment.</li>
            <li><strong>Design References:</strong> We do not do AI designs — unless an actual full real image of the design is attached. We do not accept AI-generated sketches.</li>
            ${cat.disclaimer ? `<li><strong>Please Note:</strong> ${cat.disclaimer}</li>` : ''}
          </ul>
        </div>
      `;
    } else {
      // Same exact wording as the email/SMS — the Worker sends the
      // rendered text back in holdMessage so this can never drift out of
      // sync with the other channels. Split on blank lines into
      // paragraphs; the heading line and signature line get their own
      // styling to match the rest of the page.
      const paragraphs = (holdMessage || "").split("\n\n").filter(Boolean);
      const middle = paragraphs.length > 2 ? paragraphs.slice(1, -1) : paragraphs;
      const signature = paragraphs.length > 2 ? paragraphs[paragraphs.length - 1] : null;
      bookingSection = `
        ${middle.map(p => `<p style="margin-top:14px;">${p}</p>`).join("")}
        ${signature ? `<p style="margin-top:22px; color:var(--wine);">${signature}</p>` : ""}
      `;
    }

    app.innerHTML = `
      ${wordmark(true)}
      <div class="view active">
        <div class="thankyou">
          <div>
            <span class="eyebrow" style="color:var(--wine);">Inquiry Received</span>
            <h2>Thank you${firstName ? ", " + firstName : ""}!</h2>
            ${bookingSection}
            <button class="btn-primary" id="restartBtn" style="margin-top:26px;">Back to Purda</button>
          </div>
        </div>
      </div>
      ${catTabs(true)}
    `;
    document.getElementById("restartBtn").addEventListener("click", ()=>{
      state.activeCategory = "prom";
      state.wizard = { stepIndex:0, data:{ firstName:"",lastName:"",email:"",phone:"",smsConsent:false,eventDate:"",location:"",consultation:"",description:"",size:"",budget:"",delivery:"",source:"" }, photos:[] };
      render();
    });
    bindTabs();
  }

  /* ---------------- Tabs / navigation ---------------- */
  function bindTabs(){
    document.querySelectorAll(".cat-tab").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        state.activeCategory = btn.dataset.cat;
        if(CATEGORIES[state.activeCategory].layout === "steps"){
          state.wizard = { category: state.activeCategory, stepIndex:0, data:{ firstName:"",lastName:"",email:"",phone:"",smsConsent:false,eventDate:"",location:"",consultation:"",description:"",size:"",budget:"",delivery:"",source:"" }, photos:[] };
        }
        render();
      });
    });
  }

  render();
</script>
</body>
</html>
