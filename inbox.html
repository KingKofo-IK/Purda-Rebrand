<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purda Inbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600&family=Work+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#E7E5DF; --ivory-soft:#F0EEE8; --ink:#201E1B; --ink-soft:#201E1Bb3;
    --wine:#3A3A3A; --wine-deep:#232323; --gold:#5A5A5A; --gold-soft:#8A8A8A;
    --clay:#9C4A2E; --blush:#E2E0DA; --line: rgba(36,23,19,0.14);
    --shadow: 0 30px 60px -20px rgba(36,23,19,0.35);
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Work Sans',sans-serif; color:var(--ink); background:var(--ivory); -webkit-font-smoothing:antialiased; height:100vh; overflow:hidden; }
  h1,h2{ font-family:'Fraunces',serif; font-weight:500; margin:0; }
  button, input, textarea{ font-family:'Work Sans',sans-serif; }
  .eyebrow{ font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold); }

  /* ---- Gate screen ---- */
  #gate{ position:fixed; inset:0; background:var(--ivory); display:flex; align-items:center; justify-content:center; z-index:100; }
  .gate-card{ background:var(--ivory-soft); border:1px solid var(--line); border-radius:2px; padding:40px; max-width:340px; width:100%; box-shadow:var(--shadow); text-align:center; }
  .gate-card h1{ font-size:24px; margin-top:10px; margin-bottom:20px; }
  .gate-card input{ width:100%; border:1px solid var(--line); background:#fff; padding:13px 14px; font-size:15px; border-radius:2px; outline:none; margin-bottom:14px; }
  .gate-card input:focus{ border-color:var(--wine); }
  .gate-card button{ width:100%; background:var(--wine); color:var(--ivory-soft); border:none; padding:13px; border-radius:999px; font-size:14px; font-weight:600; cursor:pointer; }
  .gate-card button:hover{ background:var(--wine-deep); }
  .gate-error{ font-size:12.5px; color:var(--clay); margin-top:10px; min-height:16px; }

  /* ---- App layout ---- */
  #app{ display:none; height:100vh; }
  #app.ready{ display:flex; }
  .sidebar{ width:320px; flex-shrink:0; border-right:1px solid var(--line); background:var(--ivory-soft); display:flex; flex-direction:column; }
  .sidebar-head{ padding:20px 20px 14px; border-bottom:1px solid var(--line); }
  .sidebar-head h1{ font-size:19px; }
  .sidebar-head-actions{ display:flex; gap:8px; margin-top:10px; }
  .refresh-btn{ background:none; border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-size:11.5px; color:var(--ink-soft); cursor:pointer; }
  .refresh-btn:hover{ border-color:var(--wine); color:var(--wine); }
  .new-btn{ background:var(--wine); color:var(--ivory-soft); border-color:var(--wine); }
  .new-btn:hover{ background:var(--wine-deep); color:var(--ivory-soft); border-color:var(--wine-deep); }
  .search-input{ width:100%; border:1px solid var(--line); background:#fff; padding:9px 12px; font-size:12.5px; border-radius:999px; outline:none; margin-top:12px; }
  .search-input:focus{ border-color:var(--wine); }
  .new-conv-form{ padding:14px 20px; border-bottom:1px solid var(--line); background:var(--blush); }
  .new-conv-form input{ width:100%; border:1px solid var(--line); background:#fff; padding:10px 12px; font-size:13px; border-radius:2px; outline:none; }
  .new-conv-form input:focus{ border-color:var(--wine); }
  .new-conv-actions{ display:flex; gap:8px; margin-top:10px; }
  .new-conv-actions button{ flex:1; border-radius:999px; padding:8px; font-size:12.5px; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink-soft); }
  .new-conv-actions button#newConvStart{ background:var(--wine); color:var(--ivory-soft); border-color:var(--wine); }
  .new-conv-actions button#newConvStart:hover{ background:var(--wine-deep); }
  .new-conv-error{ font-size:11.5px; color:var(--clay); margin-top:8px; min-height:14px; }
  .conv-list{ flex:1; overflow-y:auto; }
  .conv-item{ display:block; width:100%; text-align:left; background:none; border:none; border-bottom:1px solid var(--line); padding:14px 20px; cursor:pointer; }
  .conv-item:hover{ background:var(--blush); }
  .conv-item.active{ background:var(--blush); box-shadow:inset 3px 0 0 var(--wine); }
  .conv-name{ font-family:'Fraunces',serif; font-size:13.5px; color:var(--ink); font-weight:500; }
  .conv-number{ font-family:'Space Mono',monospace; font-size:12.5px; color:var(--ink); }
  .conv-number.secondary{ font-size:11px; color:var(--ink-soft); margin-top:1px; }
  .conv-snippet{ font-size:12.5px; color:var(--ink-soft); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .conv-date{ font-size:10.5px; color:var(--gold-soft); margin-top:4px; font-family:'Space Mono',monospace; }
  .empty-note{ padding:30px 20px; font-size:13px; color:var(--ink-soft); text-align:center; }

  .main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  #threadArea{ flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }
  .thread-head{ padding:18px 24px; border-bottom:1px solid var(--line); background:var(--ivory-soft); display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .thread-head-identity{ min-width:0; }
  .thread-head .name{ font-family:'Fraunces',serif; font-size:16px; color:var(--ink); }
  .thread-head .num{ font-family:'Space Mono',monospace; font-size:13px; color:var(--ink-soft); }
  .thread-head-actions{ display:flex; gap:8px; flex-shrink:0; }
  .mute-btn, .rename-btn{ background:#fff; border:1px solid var(--line); border-radius:999px; padding:8px 16px; font-size:12.5px; color:var(--ink-soft); cursor:pointer; white-space:nowrap; }
  .mute-btn:hover, .rename-btn:hover{ border-color:var(--wine); color:var(--wine); }
  .mute-btn.muted{ background:var(--blush); border-color:var(--clay); color:var(--clay); font-weight:600; }
  .rename-form{ display:flex; gap:8px; align-items:center; }
  .rename-form input{ border:1px solid var(--line); background:#fff; padding:7px 10px; font-size:13px; border-radius:2px; outline:none; width:160px; }
  .rename-form input:focus{ border-color:var(--wine); }
  .rename-form button{ border:1px solid var(--line); background:#fff; border-radius:999px; padding:7px 12px; font-size:12px; cursor:pointer; color:var(--ink-soft); }
  .rename-form button.save{ background:var(--wine); color:var(--ivory-soft); border-color:var(--wine); }
  .thread-body{ flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:10px; min-height:0; }
  .bubble{ max-width:60%; padding:11px 15px; border-radius:14px; font-size:14px; line-height:1.5; white-space:pre-wrap; }
  .bubble.inbound{ align-self:flex-start; background:#fff; border:1px solid var(--line); border-bottom-left-radius:3px; }
  .bubble.outbound{ align-self:flex-end; background:var(--wine); color:var(--ivory-soft); border-bottom-right-radius:3px; }
  .bubble .meta{ display:block; font-size:10px; margin-top:5px; opacity:0.6; font-family:'Space Mono',monospace; }
  .placeholder{ flex:1; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:14px; }

  .reply-bar{ border-top:1px solid var(--line); padding:16px 24px; background:var(--ivory-soft); display:flex; gap:12px; align-items:flex-end; }
  .reply-bar textarea{ flex:1; border:1px solid var(--line); background:#fff; padding:12px 14px; font-size:14px; border-radius:2px; outline:none; resize:none; min-height:44px; max-height:120px; }
  .reply-bar textarea:focus{ border-color:var(--wine); }
  .reply-bar button{ background:var(--wine); color:var(--ivory-soft); border:none; padding:12px 22px; border-radius:999px; font-size:13.5px; font-weight:600; cursor:pointer; flex-shrink:0; }
  .reply-bar button:hover{ background:var(--wine-deep); }
  .reply-bar button:disabled{ opacity:0.5; cursor:not-allowed; }
  .send-status{ font-size:12px; color:var(--clay); padding:0 24px 10px; min-height:14px; }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <span class="eyebrow">Purda Designs</span>
    <h1>Inbox Access</h1>
    <input type="password" id="gate-password" placeholder="Password" autocomplete="off">
    <button id="gate-submit">Enter</button>
    <div class="gate-error" id="gate-error"></div>
  </div>
</div>

<div id="app">
  <div class="sidebar">
    <div class="sidebar-head">
      <h1>Conversations</h1>
      <div class="sidebar-head-actions">
        <button class="refresh-btn" id="refreshBtn">Refresh</button>
        <button class="refresh-btn new-btn" id="newBtn">+ New</button>
      </div>
      <input type="text" id="searchInput" class="search-input" placeholder="Search name or number…">
    </div>
    <div id="newConvForm" class="new-conv-form" style="display:none;">
      <input type="text" id="newConvNumber" placeholder="Phone number, e.g. (555) 123-4567">
      <div class="new-conv-actions">
        <button id="newConvCancel">Cancel</button>
        <button id="newConvStart">Start</button>
      </div>
      <div class="new-conv-error" id="newConvError"></div>
    </div>
    <div class="conv-list" id="convList"><div class="empty-note">Loading…</div></div>
  </div>
  <div class="main">
    <div id="threadArea"><div class="placeholder">Select a conversation</div></div>
  </div>
</div>

<script>
  /* =========================================================================
     PURDA INBOX — manual reply tool
     Talks to the same Cloudflare Worker as everything else. Set
     WORKER_BASE below to your deployed Worker URL (no trailing slash).
     ========================================================================= */
  const WORKER_BASE = "https://purda-automation.purdahouse.workers.dev";

  let secret = sessionStorage.getItem("purda_inbox_secret") || "";
  let activeNumber = null;
  let pollTimer = null;
  let allConversations = []; // last fetched list, cached for client-side search filtering
  let contacts = {}; // number -> saved name
  let searchQuery = "";

  const gate = document.getElementById("gate");
  const app = document.getElementById("app");

  async function api(path, opts = {}) {
    const res = await fetch(WORKER_BASE + path, {
      ...opts,
      headers: { ...(opts.headers || {}), "X-Inbox-Secret": secret }
    });
    if (res.status === 401) throw new Error("UNAUTHORIZED");
    const data = await res.json();
    if (!data.success) throw new Error(data.message || "Request failed");
    return data;
  }

  async function tryEnter(pwd) {
    secret = pwd;
    try {
      await api("/api/inbox/conversations");
      sessionStorage.setItem("purda_inbox_secret", secret);
      gate.style.display = "none";
      app.classList.add("ready");
      loadContacts();
      loadConversations();
      pollTimer = setInterval(() => { loadConversations(); if (activeNumber) loadThread(activeNumber, true); }, 20000);
    } catch (err) {
      document.getElementById("gate-error").textContent = "Incorrect password.";
    }
  }

  document.getElementById("gate-submit").addEventListener("click", () => {
    const pwd = document.getElementById("gate-password").value;
    if (pwd) tryEnter(pwd);
  });
  document.getElementById("gate-password").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("gate-submit").click();
  });

  if (secret) tryEnter(secret);

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }

  // Matches the normalization pattern used server-side (worker.js's
  // normalizePhone) so numbers typed here line up with what Twilio has on
  // file — 10 digits gets a +1, 11 digits starting with 1 gets a +,
  // anything else is assumed to already be E.164.
  function normalizePhone(raw) {
    const digits = (raw || "").replace(/\D/g, "");
    if (digits.length === 10) return "+1" + digits;
    if (digits.length === 11 && digits.startsWith("1")) return "+" + digits;
    if ((raw || "").trim().startsWith("+")) return raw.trim();
    return null; // not recognizable as a phone number
  }

  async function loadContacts() {
    try {
      const data = await api("/api/inbox/contacts");
      contacts = data.contacts || {};
    } catch (err) {
      console.error("Failed to load contacts:", err.message);
      contacts = {};
    }
  }

  async function loadConversations() {
    try {
      const data = await api("/api/inbox/conversations");
      allConversations = data.conversations || [];
      renderConversationList();
    } catch (err) {
      console.error("Failed to load conversations:", err.message);
    }
  }

  // Renders from the cached allConversations + current searchQuery —
  // no network call, so typing in the search box feels instant.
  function renderConversationList() {
    const list = document.getElementById("convList");
    const q = searchQuery.trim().toLowerCase();

    const filtered = !q ? allConversations : allConversations.filter(c => {
      const name = (contacts[c.number] || "").toLowerCase();
      return c.number.toLowerCase().includes(q) || name.includes(q);
    });

    if (!filtered.length) {
      list.innerHTML = `<div class="empty-note">${allConversations.length ? "No matches." : "No conversations yet."}</div>`;
      return;
    }

    list.innerHTML = filtered.map(c => {
      const name = contacts[c.number];
      return `
        <button class="conv-item${c.number === activeNumber ? ' active' : ''}" data-number="${c.number}">
          ${name ? `<div class="conv-name">${escapeHtml(name)}</div><div class="conv-number secondary">${c.number}</div>` : `<div class="conv-number">${c.number}</div>`}
          <div class="conv-snippet">${escapeHtml(c.lastMessage || "")}</div>
          <div class="conv-date">${formatDate(c.date)}</div>
        </button>
      `;
    }).join("");
    list.querySelectorAll(".conv-item").forEach(btn => {
      btn.addEventListener("click", () => loadThread(btn.dataset.number));
    });
  }

  document.getElementById("searchInput").addEventListener("input", e => {
    searchQuery = e.target.value;
    renderConversationList();
  });

  // ---------------- New conversation ----------------
  const newBtn = document.getElementById("newBtn");
  const newConvForm = document.getElementById("newConvForm");
  const newConvNumber = document.getElementById("newConvNumber");
  const newConvError = document.getElementById("newConvError");

  newBtn.addEventListener("click", () => {
    const showing = newConvForm.style.display !== "none";
    newConvForm.style.display = showing ? "none" : "block";
    newConvError.textContent = "";
    if (!showing) { newConvNumber.value = ""; newConvNumber.focus(); }
  });
  document.getElementById("newConvCancel").addEventListener("click", () => {
    newConvForm.style.display = "none";
  });
  document.getElementById("newConvStart").addEventListener("click", () => {
    const normalized = normalizePhone(newConvNumber.value);
    if (!normalized) {
      newConvError.textContent = "Enter a valid phone number (10 digits, or with country code).";
      return;
    }
    newConvForm.style.display = "none";
    loadThread(normalized); // opens an empty thread ready for a first message — sendReply works on any number, existing conversation or not
  });
  newConvNumber.addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("newConvStart").click();
  });

  async function loadThread(number, silent) {
    activeNumber = number;
    document.querySelectorAll(".conv-item").forEach(b => b.classList.toggle("active", b.dataset.number === number));

    if (!silent) {
      document.getElementById("threadArea").innerHTML = '<div class="placeholder">Loading…</div>';
    }

    try {
      const data = await api("/api/inbox/thread?number=" + encodeURIComponent(number));
      renderThread(number, data.messages, data.muted);
    } catch (err) {
      document.getElementById("threadArea").innerHTML = '<div class="placeholder">Couldn\'t load this conversation.</div>';
    }
  }

  function renderThread(number, messages, muted) {
    currentThreadMessages = messages;
    currentThreadMuted = muted;
    const bubbles = messages.map(m => `
      <div class="bubble ${m.direction && m.direction.startsWith('inbound') ? 'inbound' : 'outbound'}">
        ${escapeHtml(m.body || "")}
        <span class="meta">${formatDate(m.date)}</span>
      </div>
    `).join("");
    const name = contacts[number];

    document.getElementById("threadArea").innerHTML = `
      <div class="thread-head">
        <div class="thread-head-identity" id="threadIdentity">
          ${name ? `<div class="name">${escapeHtml(name)}</div><div class="num">${number}</div>` : `<div class="num">${number}</div>`}
        </div>
        <div class="thread-head-actions">
          <button id="renameBtn" class="rename-btn">${name ? "✏️ Rename" : "✏️ Save name"}</button>
          <button id="muteBtn" class="mute-btn ${muted ? 'muted' : ''}">${muted ? '🔇 Bot paused — click to resume' : '🤖 Bot active — click to pause'}</button>
        </div>
      </div>
      <div class="thread-body" id="threadBody">${bubbles || '<div class="placeholder">No messages yet — send the first one below.</div>'}</div>
      <div class="send-status" id="sendStatus"></div>
      <div class="reply-bar">
        <textarea id="replyText" placeholder="Type a message…" rows="1"></textarea>
        <button id="sendBtn">Send</button>
      </div>
    `;

    const body = document.getElementById("threadBody");
    body.scrollTop = body.scrollHeight;

    document.getElementById("muteBtn").addEventListener("click", () => toggleMute(number, !muted));
    document.getElementById("renameBtn").addEventListener("click", () => showRenameForm(number, name));

    const textarea = document.getElementById("replyText");
    const sendBtn = document.getElementById("sendBtn");
    textarea.addEventListener("input", () => {
      textarea.style.height = "auto";
      textarea.style.height = Math.min(textarea.scrollHeight, 120) + "px";
    });
    textarea.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendBtn.click(); }
    });
    sendBtn.addEventListener("click", () => sendReply(number, textarea, sendBtn));
  }

  function showRenameForm(number, currentName) {
    const identity = document.getElementById("threadIdentity");
    identity.innerHTML = `
      <div class="rename-form">
        <input type="text" id="renameInput" value="${escapeHtml(currentName || "")}" placeholder="Client's name">
        <button id="renameCancel">Cancel</button>
        <button id="renameSave" class="save">Save</button>
      </div>
    `;
    const input = document.getElementById("renameInput");
    input.focus();
    input.select();
    document.getElementById("renameCancel").addEventListener("click", () => renderThread(number, currentThreadMessages, currentThreadMuted));
    document.getElementById("renameSave").addEventListener("click", () => saveContactName(number, input.value));
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("renameSave").click();
      if (e.key === "Escape") document.getElementById("renameCancel").click();
    });
  }

  let currentThreadMessages = [];
  let currentThreadMuted = false;

  async function saveContactName(number, name) {
    try {
      const data = await api("/api/inbox/contact", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ number, name })
      });
      contacts = data.contacts || contacts;
      renderConversationList();
      loadThread(number, true);
    } catch (err) {
      alert("Couldn't save the name: " + err.message);
    }
  }

  async function toggleMute(number, newMutedState) {
    const btn = document.getElementById("muteBtn");
    btn.disabled = true;
    try {
      await api("/api/inbox/mute", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ number, muted: newMutedState })
      });
      btn.className = "mute-btn" + (newMutedState ? " muted" : "");
      btn.textContent = newMutedState ? "🔇 Bot paused — click to resume" : "🤖 Bot active — click to pause";
    } catch (err) {
      alert("Couldn't update the bot status: " + err.message + "\n\nIf this is the first time you're using this, the BOT_STATE KV namespace may not be set up yet on the Worker — see the README.");
    } finally {
      btn.disabled = false;
    }
  }

  async function sendReply(number, textarea, sendBtn) {
    const text = textarea.value.trim();
    if (!text) return;
    const statusEl = document.getElementById("sendStatus");
    sendBtn.disabled = true;
    statusEl.textContent = "";
    try {
      await api("/api/inbox/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ to: number, body: text })
      });
      textarea.value = "";
      textarea.style.height = "auto";
      await loadThread(number, true);
      await loadConversations();
    } catch (err) {
      statusEl.textContent = "Failed to send — please try again.";
    } finally {
      sendBtn.disabled = false;
    }
  }

  document.getElementById("refreshBtn").addEventListener("click", () => {
    loadContacts();
    loadConversations();
    if (activeNumber) loadThread(activeNumber, true);
  });

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
</script>

</body>
</html>
